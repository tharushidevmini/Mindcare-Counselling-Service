#cloud-config
# ==============================================================================
# MindCare Counselling Service - Automated Azure VM Cloud-Init Configuration
# Bootstraps Docker, MariaDB, and automatically deploys the MindCare container
# ==============================================================================

package_update: true
package_upgrade: false

packages:
  - docker.io
  - mariadb-server
  - curl
  - git
  - ca-certificates
  - gnupg
  - lsb-release

write_files:
  - path: /opt/mindcare/deploy.sh
    permissions: '0755'
    owner: root:root
    content: |
      #!/usr/bin/env bash
      set -euo pipefail
      
      ACR_NAME="${ACR_NAME:-mindcareacr}"
      ACR_LOGIN_SERVER="${ACR_LOGIN_SERVER:-${ACR_NAME}.azurecr.io}"
      IMAGE_NAME="${IMAGE_NAME:-mindcare-app}"
      IMAGE_TAG="${IMAGE_TAG:-latest}"
      FULL_IMAGE="${ACR_LOGIN_SERVER}/${IMAGE_NAME}:${IMAGE_TAG}"
      CONTAINER_NAME="mindcare-app"
      
      systemctl stop apache2 2>/dev/null || true
      systemctl stop nginx 2>/dev/null || true
      systemctl start docker || true
      
      echo "[*] Authenticating with ACR using Managed Identity..."
      az login --identity --allow-no-subscriptions 2>/dev/null || true
      az acr login --name "${ACR_NAME}" || true
      
      echo "[*] Pulling ${FULL_IMAGE}..."
      docker pull "${FULL_IMAGE}" || true
      
      docker stop "${CONTAINER_NAME}" 2>/dev/null || true
      docker rm -f "${CONTAINER_NAME}" 2>/dev/null || true
      
      echo "[*] Starting ${CONTAINER_NAME}..."
      docker run -d \
        --name "${CONTAINER_NAME}" \
        --restart unless-stopped \
        --network host \
        -e DB_HOST="127.0.0.1" \
        -e DB_PORT="3306" \
        -e DB_USER="root" \
        -e DB_PASS="" \
        -e DB_NAME="mindcare_db" \
        -e ENCRYPTION_KEY="mindcare_aes_32char_secret_key!!" \
        "${FULL_IMAGE}"

runcmd:
  # 1. Enable and start services
  - systemctl enable --now docker
  - systemctl enable --now mariadb

  # 2. Configure MariaDB Database
  - mysql -u root -e "CREATE DATABASE IF NOT EXISTS mindcare_db CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
  - mysql -u root -e "FLUSH PRIVILEGES;"

  # 3. Download and seed database schema if available from GitHub repository
  - curl -sSfL "https://raw.githubusercontent.com/tharushidevmini/Mindcare-Counselling-Service/main/database/mindcare_db.sql" -o /tmp/mindcare_db.sql || true
  - if [ -s /tmp/mindcare_db.sql ]; then mysql -u root mindcare_db < /tmp/mindcare_db.sql; fi

  # 4. Execute MindCare Deployment
  - /opt/mindcare/deploy.sh > /var/log/mindcare-deploy.log 2>&1

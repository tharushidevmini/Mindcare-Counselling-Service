<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calm Music — MindCare</title>
  <link rel="stylesheet" href="../../../css/global.css">
  <link rel="stylesheet" href="../../../css/student.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="icon" href="../../../assets/images/logo.png">
  <style>
    .music-categories {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: .75rem;
      margin-bottom: 2rem;
    }
    .cat-card {
      border: 2px solid #eee;
      border-radius: 12px;
      padding: .9rem .75rem;
      text-align: center;
      cursor: pointer;
      transition: .2s;
      background: white;
    }
    .cat-card:hover, .cat-card.active {
      border-color: var(--color-mint);
      background: #F0FAF4;
    }
    .cat-icon { font-size: 1.6rem; margin-bottom: .3rem; }
    .cat-name { font-weight: 700; font-size: 12px; }
    .music-player {
      max-width: 480px;
      margin: 0 auto;
      text-align: center;
    }
    .music-cover {
      width: 100%;
      height: 260px;
      object-fit: cover;
      border-radius: 20px;
      margin-bottom: 1.25rem;
      box-shadow: 0 8px 32px rgba(0,0,0,0.12);
    }
    .music-title { font-size: 1.3rem; font-weight: 700; margin-bottom: .2rem; }
    .music-sub   { color: #aaa; font-size: 13px; margin-bottom: 1.25rem; }
    .progress-bar {
      width: 100%; height: 4px;
      background: #eee; border-radius: 4px;
      margin: .75rem 0; cursor: pointer;
    }
    .progress-fill {
      height: 100%; background: var(--color-mint);
      border-radius: 4px; width: 0%;
      transition: width .5s linear;
    }
    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      margin: 1rem 0;
    }
    .ctrl-btn {
      width: 46px; height: 46px;
      border-radius: 50%; border: none;
      background: var(--color-beige);
      font-size: 1rem; cursor: pointer;
      transition: .2s;
    }
    .ctrl-btn:hover { background: var(--color-mint); }
    .ctrl-btn.play {
      width: 62px; height: 62px;
      background: var(--color-mint);
      font-size: 1.3rem;
    }
    .bowl-btns {
      display: flex;
      gap: .5rem;
      justify-content: center;
      margin: .75rem 0;
      flex-wrap: wrap;
    }
    .bowl-btn {
      padding: .35rem .85rem;
      border-radius: 20px;
      border: 2px solid var(--color-beige);
      background: white;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      color: #8B6914;
      transition: .2s;
    }
    .bowl-btn:hover { background: var(--color-beige); }
    .track-item {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: .7rem 1rem;
      border-radius: 10px;
      cursor: pointer;
      transition: .2s;
      margin-bottom: .4rem;
    }
    .track-item:hover, .track-item.active { background: var(--color-beige); }
    .track-num { width: 22px; font-size: 12px; color: #aaa; text-align: center; }
    .track-info h4 { font-size: 13px; margin: 0; }
    .track-info p  { font-size: 11px; color: #aaa; margin: 0; }
    .loading-msg { text-align:center; color:#aaa; padding: 2rem; font-size:14px; }
  </style>
</head>
<body>
  <nav class="top-nav">
    <div class="nav-logo">
      <img class="logo-img" src="../../../assets/images/logo.png" alt="MindCare">
      <div><div class="logo-text">MindCare</div></div>
    </div>
    <div class="nav-user">
      <a href="../relaxation.html" class="btn btn-ghost btn-sm">← Back</a>
      <div class="avatar" id="user-avatar">S</div>
      <span id="user-name" style="font-weight:600;">Student</span>
      <button class="btn btn-danger btn-sm" onclick="doLogout()">Logout</button>
    </div>
  </nav>

  <div class="layout">
    <nav class="sidebar">
      <div class="sidebar-section">
        <div class="sidebar-label">My Workspace</div>
        <a href="../dashboard.html"  class="sidebar-link"><span class="link-icon"><i class="bi bi-bar-chart-fill"></i></span> Dashboard</a>
        <a href="../diary.html"      class="sidebar-link"><span class="link-icon"><i class="bi bi-journal-bookmark"></i></span> My Diary</a>
        <a href="../booking.html"    class="sidebar-link"><span class="link-icon"><i class="bi bi-calendar3"></i></span> Book Counselor</a>
        <a href="../relaxation.html" class="sidebar-link active"><span class="link-icon"><i class="bi bi-flower1"></i></span> Relaxation Zone</a>
        <a href="../forum.html"      class="sidebar-link"><span class="link-icon"><i class="bi bi-chat-dots"></i></span> Anonymous Forum</a>
      </div>
      <div class="sidebar-emergency">
        <p>Need immediate help?</p>
        <a href="../../public/emergency.html">Crisis Helplines</a>
      </div>
    </nav>

    <main class="main">
      <div class="page-header">
        <h1>Calm Music <i class="bi bi-music-note-beamed"></i></h1>
        <p>Choose a mood and let the music carry you</p>
      </div>

      <div class="music-categories" id="music-categories">
        <div class="loading-msg">Loading categories...</div>
      </div>

      <div class="two-col" style="gap:2rem; align-items:start;">
        <div class="music-player">
          <img class="music-cover" id="music-cover"
            src="https://images.unsplash.com/photo-1465146344425-f00d5f5c8f07?w=600&q=80"
            alt="Music">

          <div class="music-title" id="music-title">Loading...</div>
          <div class="music-sub"   id="music-sub">—</div>

          <div class="progress-bar" onclick="seekAudio(event)">
            <div class="progress-fill" id="progress-fill"></div>
          </div>
          <div style="display:flex; justify-content:space-between; font-size:11px; color:#aaa;">
            <span id="time-current">0:00</span>
            <span id="time-total">—</span>
          </div>

          <div class="controls">
            <button class="ctrl-btn" onclick="prevTrack()">⏮</button>
            <button class="ctrl-btn play" id="play-btn" onclick="togglePlay()">▶</button>
            <button class="ctrl-btn" onclick="nextTrack()">⏭</button>
          </div>

          <div style="display:flex; align-items:center; gap:.75rem; justify-content:center; margin-bottom:1rem;">
            <span style="font-size:13px;"><i class="bi bi-volume-down-fill"></i></span>
            <input type="range" min="0" max="100" value="60" style="width:110px;"
              oninput="setVolume(this.value)">
            <span style="font-size:13px;"><i class="bi bi-volume-up-fill"></i></span>
          </div>

          <div style="font-size:12px; color:#aaa; margin-bottom:.5rem;"><i class="bi bi-stars"></i> Singing Bowl Tones</div>
          <div class="bowl-btns">
            <button class="bowl-btn" onclick="playBowlTone(396)"><i class="bi bi-bell-fill"></i> 396 Hz — Release Fear</button>
            <button class="bowl-btn" onclick="playBowlTone(528)"><i class="bi bi-bell-fill"></i> 528 Hz — Healing</button>
            <button class="bowl-btn" onclick="playBowlTone(639)"><i class="bi bi-bell-fill"></i> 639 Hz — Connection</button>
            <button class="bowl-btn" onclick="playBowlTone(741)"><i class="bi bi-bell-fill"></i> 741 Hz — Clarity</button>
          </div>
        </div>

        <div class="card">
          <div class="card-title" id="playlist-title">Playlist</div>
          <div id="track-list-items"><div class="loading-msg">Loading tracks...</div></div>
        </div>
      </div>
    </main>
  </div>

  <script src="../../../js/auth.js?v=5"></script>
  <script>
    const API_BASE = '../../../../backend/api/relaxation';

    const CAT_ICONS = {
      calm:   { icon: '<i class="bi bi-leaf"></i>', label: 'Calm' },
      sleep:  { icon: '<i class="bi bi-moon-stars-fill"></i>', label: 'Sleep' },
      energy: { icon: '<i class="bi bi-lightning-charge-fill"></i>', label: 'Energy' },
      water:  { icon: '<i class="bi bi-droplet-fill"></i>', label: 'Water Therapy' },
      bowl:   { icon: '<i class="bi bi-bell-fill"></i>', label: 'Singing Bowls' },
    };

    let allTracks       = {};
    let currentCategory = null;
    let currentTrack    = 0;
    let audio           = new Audio();
    let playing         = false;

    audio.addEventListener('timeupdate', () => {
      if (audio.duration) {
        document.getElementById('progress-fill').style.width = (audio.currentTime / audio.duration * 100) + '%';
        document.getElementById('time-current').textContent = fmt(audio.currentTime);
        document.getElementById('time-total').textContent   = fmt(audio.duration);
      }
    });
    audio.addEventListener('ended', nextTrack);

    async function loadAllTracks() {
      try {
        const res  = await fetch(`${API_BASE}/music.php`);
        const data = await res.json();

        if (!data.tracks || data.tracks.length === 0) {
          document.getElementById('music-categories').innerHTML =
            '<div class="loading-msg">No tracks found.</div>';
          return;
        }

        data.tracks.forEach(t => {
          if (!allTracks[t.category]) allTracks[t.category] = [];
          allTracks[t.category].push(t);
        });

        renderCategories();

      } catch (err) {
        console.error('Failed to load tracks:', err);
        document.getElementById('music-categories').innerHTML =
          '<div class="loading-msg" style="color:#e57373;">Failed to load. Check server.</div>';
      }
    }

    function renderCategories() {
      const cats = Object.keys(allTracks);
      if (cats.length === 0) return;

      document.getElementById('music-categories').innerHTML = cats.map((cat, i) => {
        const meta = CAT_ICONS[cat] || { icon: '<i class="bi bi-music-note-beamed"></i>', label: cat.charAt(0).toUpperCase() + cat.slice(1) };
        return `
          <div class="cat-card ${i === 0 ? 'active' : ''}" onclick="selectCategory('${cat}', this)">
            <div class="cat-icon">${meta.icon}</div>
            <div class="cat-name">${meta.label}</div>
          </div>`;
      }).join('');

      selectCategory(cats[0], document.querySelector('.cat-card'));
    }

    function selectCategory(key, el) {
      currentCategory = key;
      currentTrack    = 0;
      document.querySelectorAll('.cat-card').forEach(c => c.classList.remove('active'));
      el.classList.add('active');
      const meta = CAT_ICONS[key] || { label: key };
      document.getElementById('playlist-title').textContent = 'Playlist — ' + meta.label;
      loadTrack(0);
      if (playing) audio.play();
    }

    function loadTrack(i) {
      currentTrack = i;
      const tracks = allTracks[currentCategory];
      if (!tracks || tracks.length === 0) return;
      const t = tracks[i];

      audio.src = t.audio_url;
      document.getElementById('music-title').textContent = t.title;
      document.getElementById('music-sub').textContent   = t.category.charAt(0).toUpperCase() + t.category.slice(1);
      document.getElementById('music-cover').src         = t.cover_url ||
        'https://images.unsplash.com/photo-1465146344425-f00d5f5c8f07?w=600&q=80';
      document.getElementById('progress-fill').style.width = '0%';
      document.getElementById('time-current').textContent  = '0:00';
      document.getElementById('time-total').textContent    = '—';
      renderTrackList();
    }

    function togglePlay() {
      if (playing) {
        audio.pause(); playing = false;
        document.getElementById('play-btn').textContent = '▶';
      } else {
        audio.play().catch(() => alert('Could not play. Check internet connection.'));
        playing = true;
        document.getElementById('play-btn').textContent = '⏸';
      }
    }

    function nextTrack() {
      const tracks = allTracks[currentCategory] || [];
      loadTrack((currentTrack + 1) % tracks.length);
      if (playing) audio.play();
    }

    function prevTrack() {
      const tracks = allTracks[currentCategory] || [];
      loadTrack((currentTrack - 1 + tracks.length) % tracks.length);
      if (playing) audio.play();
    }

    function setVolume(val) { audio.volume = val / 100; }

    function seekAudio(e) {
      const pct = e.offsetX / e.currentTarget.offsetWidth;
      if (audio.duration) audio.currentTime = pct * audio.duration;
    }

    function fmt(s) {
      return Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
    }

    function renderTrackList() {
      const tracks = allTracks[currentCategory] || [];
      document.getElementById('track-list-items').innerHTML = tracks.map((t, i) => `
        <div class="track-item ${i === currentTrack ? 'active' : ''}"
             onclick="loadTrack(${i}); if(playing) audio.play();">
          <div class="track-num">${i === currentTrack && playing ? '<i class="bi bi-soundwave"></i>' : i + 1}</div>
          <div class="track-info">
            <h4>${t.title}</h4>
            <p>${t.category}</p>
          </div>
        </div>`).join('');
    }

    function playBowlTone(freq) {
      try {
        const ctx  = new (window.AudioContext || window.webkitAudioContext)();
        const osc  = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.frequency.value = freq; osc.type = 'sine';
        gain.gain.setValueAtTime(0, ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.4, ctx.currentTime + 0.2);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 4);
        osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 4);
      } catch(e) {}
    }

    loadAllTracks();
  </script>
</body>
</html>

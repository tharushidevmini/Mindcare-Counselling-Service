<!DOCTYPE html>
<!-- FILE: frontend/pages/counselor/diary-review.html -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shared Diaries — MindCare Counselor</title>
  <link rel="stylesheet" href="../../css/global.css">
  <link rel="stylesheet" href="../../css/counselor.css">
  <link rel="icon" href="../../assets/images/logo.png">
  <style>
    .dr-list { margin-top: 1rem; }
    .dr-item { display:flex; align-items:center; gap:.85rem; padding:.9rem 1rem; border:1.5px solid var(--border); border-radius:var(--radius-sm); margin-bottom:.6rem; cursor:pointer; transition:.2s; background:var(--white); }
    .dr-item:hover { border-color: var(--color-orange); }
    .dr-emoji { font-size:1.5rem; width:2rem; text-align:center; }
    .dr-main { flex:1; }
    .dr-student { font-weight:700; font-size:14px; }
    .dr-title { font-size:12.5px; color:var(--text-3); margin-top:2px; }
    .dr-date { font-size:11.5px; color:var(--text-3); }
    .dr-empty { color:var(--text-3); font-size:13.5px; padding:1.5rem 0; text-align:center; }
    #dr-modal-overlay { display:none; }
  </style>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>

  <nav class="top-nav">
    <div class="nav-logo">
      <img class="logo-img" src="../../assets/images/logo.png" alt="MindCare">
      <div><div class="logo-text">MindCare</div></div>
    </div>
    <div class="nav-user">
      <div class="avatar" id="user-avatar">C</div>
      <span id="user-name" style="font-weight:600;">Counselor</span>
      <button class="btn btn-danger btn-sm" onclick="doLogout()">Logout</button>
    </div>
  </nav>

  <div class="layout">
    <nav class="sidebar">
      <div class="sidebar-section">
        <div class="sidebar-label">Counselor Panel</div>
        <a href="dashboard.html"     class="sidebar-link"><span class="link-icon"><i class="bi bi-calendar3"></i></span> Appointments</a>
        <a href="alerts.html"        class="sidebar-link"><span class="link-icon"><i class="bi bi-exclamation-triangle-fill"></i></span> Student Alerts</a>
        <a href="diary-review.html"  class="sidebar-link active"><span class="link-icon"><i class="bi bi-journal-text"></i></span> Shared Diaries</a>
        <a href="resources.html"     class="sidebar-link"><span class="link-icon"><i class="bi bi-upload"></i></span> Resource Manager</a>
        <a href="../public/index.html" class="sidebar-link"><span class="link-icon"><i class="bi bi-house-door-fill"></i></span> Home</a>
        <a href="diary.html" class="sidebar-link"><span class="link-icon"><i class="bi bi-journal-bookmark"></i></span> My Notes</a>
      </div>
    </nav>

    <main class="main">
      <div class="page-header">
        <h1>Shared Diary Entries <i class="bi bi-journal-text"></i></h1>
        <p>Only entries a student chose to "Share with Counselor" appear here — private entries stay private</p>
      </div>

      <div class="card">
        <div style="display:flex; align-items:center; gap:.75rem; flex-wrap:wrap;">
          <label class="form-label" style="margin-bottom:0;">Filter by student:</label>
          <select class="form-input form-select searchable" id="dr-student-filter" style="max-width:280px;" onchange="loadSharedEntries()">
            <option value="">All students</option>
          </select>
        </div>

        <div class="dr-list" id="dr-list">
          <div class="dr-empty">Loading…</div>
        </div>
      </div>
    </main>
  </div>

  <!-- ── View Modal ── -->
  <div class="modal-overlay" id="dr-modal-overlay" onclick="if(event.target===this) closeDrModal()">
    <div class="modal-box" style="position:relative;">
      <button type="button" aria-label="Close" onclick="closeDrModal()"
        style="position:absolute; top:14px; right:16px; background:none; border:none; font-size:22px; color:var(--text-3); cursor:pointer; line-height:1;"><i class="bi bi-x-lg"></i></button>
      <div id="dr-modal-date" style="font-size:11px; color:var(--text-3); margin-bottom:.4rem;"></div>
      <h3 id="dr-modal-title" style="margin-bottom:.4rem;"></h3>
      <div id="dr-modal-student" class="badge badge-mint" style="margin-bottom:1rem;"></div>
      <div id="dr-modal-content" style="padding:1rem; background:var(--beige-light); border-radius:var(--radius-sm); font-size:14px; line-height:1.8; white-space:pre-wrap; color:var(--text-2);">
        Loading…
      </div>
      <button class="btn btn-ghost btn-full" style="margin-top:1.2rem;" onclick="closeDrModal()">Close</button>
    </div>
  </div>

  <script src="../../js/auth.js?v=5"></script>
  <script src="../../js/searchable-select.js"></script>
  <script>
    const API = '../../../backend/api/counselor/shared_diary.php';
    const VIEW_API = '../../../backend/api/diary/view.php';

    async function loadSharedEntries() {
      const list = document.getElementById('dr-list');
      const studentId = document.getElementById('dr-student-filter').value;
      list.innerHTML = '<div class="dr-empty">Loading…</div>';
      try {
        const res  = await fetch(`${API}${studentId ? '?student_id=' + studentId : ''}`);
        const data = await res.json();

        // Populate student filter once
        const sel = document.getElementById('dr-student-filter');
        if (sel.options.length === 1 && data.students) {
          data.students.forEach(s => {
            const opt = document.createElement('option');
            opt.value = s.id; opt.textContent = s.full_name;
            sel.appendChild(opt);
          });
        }

        if (!data.entries || data.entries.length === 0) {
          list.innerHTML = '<div class="dr-empty">No shared diary entries yet.</div>';
          return;
        }

        list.innerHTML = data.entries.map(e => `
          <div class="dr-item" onclick="viewEntry(${e.id}, '${escapeHtml(e.student_name)}')">
            <div class="dr-emoji">${e.mood_emoji || '📝'}</div>
            <div class="dr-main">
              <div class="dr-student">${escapeHtml(e.student_name)}</div>
              <div class="dr-title">${escapeHtml(e.title || 'Untitled entry')}</div>
            </div>
            <div class="dr-date">${e.entry_date}</div>
          </div>`).join('');
      } catch {
        list.innerHTML = '<div class="dr-empty">Network error — make sure XAMPP is running.</div>';
      }
    }

    function escapeHtml(s) {
      return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    async function viewEntry(id, studentName) {
      document.getElementById('dr-modal-overlay').style.display = 'flex';
      document.getElementById('dr-modal-title').textContent = 'Loading…';
      document.getElementById('dr-modal-student').textContent = studentName;
      document.getElementById('dr-modal-date').textContent = '';
      document.getElementById('dr-modal-content').textContent = 'Loading…';

      try {
        const res  = await fetch(`${VIEW_API}?id=${id}`);
        const data = await res.json();
        if (data.error) {
          document.getElementById('dr-modal-title').textContent = 'Could not load';
          document.getElementById('dr-modal-content').textContent = data.error;
          return;
        }
        document.getElementById('dr-modal-title').textContent = (data.mood_emoji || '') + ' ' + (data.title || 'Untitled entry');
        document.getElementById('dr-modal-date').textContent = data.entry_date;
        document.getElementById('dr-modal-content').textContent = data.content;
      } catch {
        document.getElementById('dr-modal-content').textContent = 'Network error.';
      }
    }

    function closeDrModal() {
      document.getElementById('dr-modal-overlay').style.display = 'none';
    }

    document.addEventListener('keydown', (e) => {
      const m = document.getElementById('dr-modal-overlay');
      if (e.key === 'Escape' && m && m.style.display === 'flex') closeDrModal();
    });

    loadSharedEntries();
  </script>
</body>
</html>

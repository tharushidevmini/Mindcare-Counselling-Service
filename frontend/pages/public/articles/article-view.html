<!DOCTYPE html>
<!-- FILE: frontend/pages/public/article-view.html -->
<!-- Dynamic reader for counselor-published articles. Static "Featured
     Guides" each have their own hand-written page (see articles/*.html);
     this one page instead reads ?id= from the URL and renders whichever
     counselor-published resource matches, fetched from the same public,
     no-login endpoint the library page itself uses. Because this is a
     real page navigation (not a JS modal), it has its own browser-history
     entry — pressing Back naturally returns to library.html. -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Article — MindCare</title>
  <link rel="stylesheet" href="../../../css/global.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="icon" href="../../../assets/images/logo.png">
  <style>
    .article-hero {
      width:100%; height:320px; object-fit:cover; border-radius:16px; margin-bottom:2rem;
    }
    .article-hero-fallback {
      width:100%; height:320px; border-radius:16px; margin-bottom:2rem;
      display:flex; align-items:center; justify-content:center; font-size:4rem; color:#fff;
      background:linear-gradient(135deg, var(--color-orange), var(--color-mint));
    }
    .article-wrap {
      max-width:780px; margin:0 auto; padding:2rem 1.5rem;
    }
    .article-tag {
      display:inline-block; background:var(--color-mint); color:#1A7A48;
      padding:4px 14px; border-radius:20px; font-size:12px; font-weight:600;
      margin-bottom:1rem;
    }
    .article-title {
      font-size:2rem; font-weight:800; color:var(--text); margin-bottom:.5rem;
    }
    .article-meta {
      color:#aaa; font-size:13px; margin-bottom:2rem;
      padding-bottom:1rem; border-bottom:1px solid #eee;
    }
    .article-body p {
      color:#555; line-height:1.9; margin-bottom:1rem; font-size:15px;
      white-space:pre-wrap;
    }
    .tip-box {
      background:var(--color-beige); border-left:4px solid var(--color-orange);
      padding:1rem 1.25rem; border-radius:8px; margin:1.5rem 0;
    }
    .tip-box p { margin:0; color:#5a3e00; font-size:14px; white-space:normal; }
  </style>
</head>
<body>

  <nav class="pub-nav">
    <div class="nav-logo">
      <img class="logo-img" src="../../../assets/images/logo.png" alt="MindCare">
      <div><div class="logo-text">MindCare</div></div>
    </div>
    <div class="pub-nav-links">
      <a href="../library.html" class="pub-nav-link">← Library</a>
      <a href="../../login.html" class="btn btn-primary">Login</a>
    </div>
  </nav>

  <div class="article-wrap" id="article-wrap">
    <p style="text-align:center;color:var(--text-3);padding:3rem 0;">Loading…</p>
  </div>

  <script>
    function avEsc(s) {
      return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    async function loadArticle() {
      const wrap = document.getElementById('article-wrap');
      const id = new URLSearchParams(window.location.search).get('id');

      if (!id) {
        wrap.innerHTML = `<p style="text-align:center;color:var(--text-3);padding:3rem 0;">No article specified. <a href="../library.html">← Back to Library</a></p>`;
        return;
      }

      try {
        const API = window.location.origin + '/mindcare_final/backend/api/resources/public_list.php';
        const res = await fetch(API);
        const data = await res.json();
        const article = (data.resources || []).find(r => String(r.id) === String(id) && r.resource_type !== 'video');

        if (!article) {
          wrap.innerHTML = `<p style="text-align:center;color:var(--text-3);padding:3rem 0;">This article isn't available. <a href="../library.html">← Back to Library</a></p>`;
          return;
        }

        document.title = article.title + ' — MindCare';

        const hero = article.file_path
          ? `<img class="article-hero" src="${avEsc(article.file_path)}" alt="${avEsc(article.title)}">`
          : `<div class="article-hero-fallback"><i class="bi bi-file-earmark-text-fill"></i></div>`;

        const badgeLabel = article.resource_type === 'audio' ? 'Audio' : 'Article';
        const dateLabel = article.created_at
          ? new Date(article.created_at).toLocaleDateString(undefined, { year:'numeric', month:'long', day:'numeric' })
          : '';

        wrap.innerHTML = `
          ${hero}
          <span class="article-tag"><i class="bi bi-book-half"></i> ${badgeLabel}</span>
          <h1 class="article-title">${avEsc(article.title)}</h1>
          <div class="article-meta">MindCare Mental Health Library${dateLabel ? ' &nbsp;·&nbsp; ' + dateLabel : ''}</div>
          <div class="article-body">
            <p>${avEsc(article.description || 'No content provided.')}</p>
          </div>
          <div class="tip-box" style="margin-top:2rem;">
            <p><i class="bi bi-chat-dots-fill"></i> <strong>MindCare counselors are available</strong> for confidential support. <a href="../../login.html" style="color:var(--color-orange);">Log in to book a session →</a></p>
          </div>
        `;
      } catch (err) {
        wrap.innerHTML = `<p style="text-align:center;color:var(--red);padding:3rem 0;">Could not load this article. <a href="../library.html">← Back to Library</a></p>`;
      }
    }

    loadArticle();
  </script>

  <script src="../../../js/main.js"></script>
</body>
</html>

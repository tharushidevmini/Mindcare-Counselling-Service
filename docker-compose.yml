version: "3.8"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mindcare_app
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASS: rootpassword
      DB_NAME: mindcare_db
      ENCRYPTION_KEY: mindcare_aes_32char_secret_key!!
    depends_on:
      - db

  db:
    image: mariadb:10.11
    container_name: mindcare_db
    restart: unless-stopped
    ports:
      - "3308:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: mindcare_db
    volumes:
      - ./database/mindcare_db.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - db_data:/var/lib/mysql

volumes:
  db_data:
